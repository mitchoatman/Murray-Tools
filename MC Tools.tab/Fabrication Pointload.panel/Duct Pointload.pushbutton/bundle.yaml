# bundle title
title:
  "Duct\nPointload"

# bundle tooltip
tooltip: |-
  Calculates the combined weight of selected Fabrication Ducts
  and divides that weight across the selected Fabrication Hangers.
  It rounds the values to a power of 10x.
  Example: 1 = 0-10.lbs  2 = 11-20.lbs  3 = 21-30.lbs  4 = 31-40.lbs
    1. Run Command.
    2. Select Fabrication Ducts and Hangers to collect weight from.
    Muti-point supports weights are reduced automatically.

  [Shift]+Click:
  Add actual loads NOT to the power of 10x

# context directives are listed under `context` key, the order does not matter
