title:
  "Valve\nNumber"

tooltip: >-
  Writes User Defined Valve Number Value to the FP_Valve Number Parameter and to Fabrication Custom Data Field so data will follow MAJ export.

    1. Select elements you want to assign a Valve Number.
    2. Run Script.
    3. Enter Valve Number value in the dialog.
    4. Click Ok


