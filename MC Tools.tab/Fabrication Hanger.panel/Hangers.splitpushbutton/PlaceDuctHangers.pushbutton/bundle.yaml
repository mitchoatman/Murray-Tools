# bundle title
title:
  "Place Duct\nHangers"

# bundle tooltip
tooltip: |-
  Populates hangers on selected ducts(s).
    1. Run Command.
    2. Select a fabrication ducts to populate hangers on.

  [Shift]+Click:    
  Opens hanger config to define:
  - Hanger Type
  - Round Duct Spacing
  - Rectangle Duct Spacing
  - Attach to Structure

