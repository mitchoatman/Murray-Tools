#highlight: new

# bundle title
title:
  "Swap\nHangers"

# bundle tooltip
tooltip: |-
  Swap selected hangers with a hanger loaded in fabrication service.
  1. Execute command.
  2. Pick a single hanger on service.
  3. Choose hanger and if you want rod attached to structure.
  4. Select hangers to replace.

  [Shift]+Click:    
  Removes service filter enabling the ability to swap hanger and their service.

# context directives are listed under `context` key, the order does not matter
#context:
#  - Selection

