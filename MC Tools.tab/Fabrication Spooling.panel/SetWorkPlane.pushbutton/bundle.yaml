# highlight: new

# bundle title
title:
  "Set Work\nPlane"

# bundle tooltip
tooltip: |-
  Sets a Work Plane to selected Fabrication Part.
    1. Run Command.
    2. Select Fabrication Part you align work plane to.
    3. Choose direction of work plane.
    
    DOES NOT ALIGN TO THE ANGLE OF SLOPING PIPE!

  [Shift]+Click:    
  Turn off workplane in active view.

# context directives are listed under `context` key, the order does not matter
# context:
  # - Selection

