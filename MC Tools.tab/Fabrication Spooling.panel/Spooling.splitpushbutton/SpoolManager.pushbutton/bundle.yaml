title:
  "Spool\nManager"

tooltip: |-
  Opens a panel that allows the folling actions:
   - Writes Assembly data to the STRATUS Assembly parameter.
   - Collects a list of all Assemblies in active view.
   - Zoom to elements using specific Assembly number.
   - Make view filters of Assemblies.

