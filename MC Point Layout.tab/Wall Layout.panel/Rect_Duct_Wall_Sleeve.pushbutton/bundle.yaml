# highlight: new
title:
  "Duct Rect\nWall Opening"

tooltip: |-
  Place wall opening on duct centerline at specified location(s) for point layout purposes.
  It will also append Fabrication service name to the sleeve.
  
  1.  Select the duct to place opening on.
  2.  Pick the intersection of the duct centerline and face of wall.
  3.  Repeat as necessary, ESC to end the command.
  
  If an opening is selected prior to executing button it will swap Width and Depth of that selected element.
  1.  Select wall opening.
  2.  Run command.
  3.  Opening will be flipped.

  [Shift]+Click:
  Places opening on duct centerline at selected linked wall location.
  User is not specifying a point, they are selecting a linked wall.

# context directives are listed under `context` key, the order does not matter
#context:
#  - Selection

